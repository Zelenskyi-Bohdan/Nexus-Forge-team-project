<section class="section feedbacks" aria-labelledby="feedbacks-header">
  <div class="feedbacks-container container">
    <div class="feedbacks-description-container">
      <load src="partials/decoration.html" />
      <h2 class="section-header" id="feedbacks-header">
        Words from Our Wonderful Couples
      </h2>
      <p class="section-description">
        Read what the couples who entrusted us with their most precious memories
        have to say.
      </p>
    </div>

    <div
      class="portfolio-loader is-hidden"
      id="feedbacks-loader"
      aria-live="polite"
    >
      <span class="spinner" aria-hidden="true"></span>
      <span class="visually-hidden">Loading images...</span>
    </div>

    <div class="feedbacks-content-container">
      <div class="feedbacks-swiper swiper">
        <ul class="feedbacks-list swiper-wrapper"></ul>
      </div>

      <div class="feedbacks-list-bottom">
        <div class="swiper-pagination"></div>

        <div class="feedbacks-btn-container">
          <button
            class="feedbacks-btn swiper-button-prev"
            type="button"
            aria-label="Previous response"
          >
            <svg
              class="feedbacks-btn-icon"
              width="24"
              height="24"
              aria-hidden="true"
            >
              <use href="./img/sprite.svg#icon-arrow-back"></use>
            </svg>
          </button>
          <button
            class="feedbacks-btn swiper-button-next"
            type="button"
            aria-label="Next response"
          >
            <svg
              class="feedbacks-btn-icon"
              width="24"
              height="24"
              aria-hidden="true"
            >
              <use href="./img/sprite.svg#icon-arrow-forward"></use>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
