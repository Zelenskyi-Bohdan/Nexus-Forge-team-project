<section
  class="section portfolio"
  id="portfolio"
  aria-labelledby="portfolio-header"
>
  <div class="portfolio-container container">
    <div class="portfolio-title-block">
      <load src="partials/decoration.html" />
      <h2 class="section-header" id="portfolio-header">Portfolio Highlights</h2>
    </div>

    <ul class="portfolio-filters list">
      <li class="filter-item">
        <button
          class="filter-btn active"
          type="button"
          data-category="all"
          aria-pressed="true"
        >
          All Photos
        </button>
      </li>
    </ul>

    <ul class="portfolio-list list" aria-live="polite"></ul>

    <load src="/partials/loader.html" />

    <div class="portfolio-pagination">
      <button class="show-more-btn is-hidden" type="button" id="show-more-btn">
        Show More
      </button>
    </div>
  </div>
</section>
