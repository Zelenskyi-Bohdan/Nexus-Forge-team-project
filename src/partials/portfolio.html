<section
  class="section-header"
  id="portfolio"
  aria-labelledby="portfolio-heading"
>
  <div class="container portfolio-container">
    <div class="portfolio-title-block">
      <load src="partials/decoration.html" />
      <h2 class="portfolio-title" id="portfolio-heading">
        Portfolio Highlights
      </h2>
    </div>

    <ul class="portfolio-filters list">
      <li class="filter-item">
        <button
          class="filter-btn active"
          type="button"
          data-category="all"
          aria-pressed="true"
        >
          All Photos
        </button>
      </li>
    </ul>

    <div
      class="portfolio-loader is-hidden"
      id="portfolio-loader"
      aria-live="polite"
    >
      <span class="spinner" aria-hidden="true"></span>
      <span class="visually-hidden">Loading images...</span>
    </div>

    <ul class="portfolio-list list" aria-live="polite"></ul>

    <div class="portfolio-pagination">
      <button class="show-more-btn is-hidden" type="button" id="show-more-btn">
        Show More
      </button>
    </div>
  </div>
</section>
